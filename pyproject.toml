[project]
name = "case-delivery-agent"
version = "0.1.0"
description = "Beauty Pizza ordering agent (Agno + Order API) and Menu service (SQLite knowledge base + LanceDB)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agno>=3.1.12",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "lancedb>=0.41.0",
    "langfuse>=5.2.0",
    "openai>=3.46.0",
    "openinference-instrumentation-agno>=1.1.2",
    "presidio-analyzer>=2.2.366",
    "presidio-anonymizer>=2.2.366",
    "pt-core-news-sm",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "sqlalchemy[asyncio]>=2.1.8",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
delivery-agent = "delivery_agent.main:run"
menu-service = "menu_service.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delivery_agent", "src/menu_service"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["specs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # pt-BR text legitimately contains ambiguous unicode

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires the Order API running locally",
    "evals: requires OPENAI_API_KEY and the Order API (live model conversations)",
]
addopts = "-m 'not integration and not evals'"

[tool.uv.sources]
pt-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/pt_core_news_sm-3.8.0/pt_core_news_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]
